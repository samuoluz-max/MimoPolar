<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mimo Polar</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsavidade.css" />
  </head>
  <body>
    <header class="cabecalho">
      <a
        class="marca"
        href="index.html"
        aria-label="Mimo Polar, página inicial"
      >
        <span class="marca-icone" aria-hidden="true">✳</span>
        <span>Mimo <strong>Polar</strong></span>
      </a>
      <nav class="menu" aria-label="Navegação principal">
        <a class="ativo" href="index.html" aria-current="page">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="galeria.html">Inspirações</a>
        <a href="sobre.html">Sobre nós</a>
        <a href="contato.html">Contato</a>
      </nav>
      <button class="botao-musica" id="btn-musica" type="button">
        Ativar música
      </button>
    </header>

    <main>
      <section class="ini">
        <h1>Bem-vindo à Mimo Polar!</h1>
        <p>Descubra a magia do natal com nossas pelucias Natalinas!</p>
      </section>

      <section
        class="parallax-natal"
        aria-label="Papai Noel voando sobre uma floresta nevada"
      >
        <div class="parallax-palco">
          <div class="ceu-estrelado" aria-hidden="true"></div>
          <img
            class="parallax-imagem parallax-floresta-distante"
            src="img/banners/floresta-distante.jpg"
            alt=""
            aria-hidden="true"
            data-velocidade="0.08"
          />
          <img
            class="parallax-imagem parallax-floresta-proxima"
            src="img/parallax/floresta-proxima.png"
            alt=""
            aria-hidden="true"
            data-velocidade="0.18"
          />
          <img
            class="parallax-imagem parallax-papai-noel"
            src="img/parallax/papai-noel-treno.png"
            alt="Papai Noel voando em seu trenó"
            data-velocidade="1"
            data-eixo="x"
          />
          <div
            class="parallax-neve"
            data-velocidade="0.04"
            aria-hidden="true"
          ></div>
          <p class="legenda-cenario">Uma noite mágica está chegando...</p>
        </div>
      </section>
    </main>
    <script src="js/parallax.js" defer></script>
  </body>
</html>
