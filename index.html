<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mimo Polar</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsavidade.css" />
  </head>
  <body>
    <header class="cabecalho">
      <a
        class="marca"
        href="index.html"
        aria-label="Mimo Polar, página inicial"
      >
        <span class="marca-icone" aria-hidden="true">✳</span>
        <span>Mimo <strong>Polar</strong></span>
      </a>
      <nav class="menu" aria-label="Navegação principal">
        <a class="ativo" href="index.html" aria-current="page">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="galeria.html">Inspirações</a>
        <a href="sobre.html">Sobre nós</a>
        <a href="contato.html">Contato</a>
      </nav>
      <button class="botao-musica" id="btn-musica" type="button">
        Ativar música
      </button>
    </header>

    <main>
      <section
        class="parallax-natal"
        aria-label="Bem-vindo à Mimo Polar, Papai Noel voando sobre uma floresta nevada"
      >
        <div class="parallax-palco">
          <div class="ceu-estrelado" aria-hidden="true"></div>
          <div class="parallax-intro">
            <h1>Bem-vindo à Mimo Polar!</h1>
            <p>Descubra a magia do Natal com nossas pelúcias natalinas!</p>
          </div>
          <img
            class="parallax-imagem parallax-floresta-distante"
            src="img/banners/floresta-longe.webp"
            alt=""
            aria-hidden="true"
            data-velocidade="0.05"
          />
          <img
            class="parallax-imagem parallax-floresta-proxima"
            src="img/banners/floresta-proxima.webp"
            alt=""
            aria-hidden="true"
            data-velocidade="0.13"
          />
          <img
            class="parallax-imagem parallax-chao"
            src="img/banners/neve.webp"
            alt=""
            aria-hidden="true"
          />
          <img
            class="parallax-imagem parallax-papai-noel"
            src="img/banners/papai-noel-treno.webp"
            alt="Papai Noel voando em seu trenó"
            data-velocidade="1.1"
            data-eixo="x"
          />
        </div>
      </section>
    </main>
    <script src="js/parallax.js" defer></script>
    <script src="js/audio.js" defer></script>
    <footer class="rodape">
      <div class="container rodape-conteudo">
        <a class="marca marca-rodape" href="index.html"
          >Mimo <strong>Polar</strong></a
        >
        <p>Pelúcias natalinas para deixar seu Natal ainda mais especial.</p>
        <nav aria-label="Links do rodapé">
          <a href="sobre.html">Nossa história</a>
          <a href="contato.html">Fale com a gente</a>
        </nav>
        <small>&copy; 2026 Mimo Polar. Projeto acadêmico.</small>
      </div>
    </footer>
  </body>
</html>
